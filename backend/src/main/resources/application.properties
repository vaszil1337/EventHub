# Server Configuration
server.port=8080

# Application Name
spring.application.name=eventhub-backend

# Datasource Configuration (Defaults to H2 PostgreSQL mode for zero-setup local dev/test, seamlessly switchable to PostgreSQL via env vars)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:eventhub;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA & Hibernate
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.hu.eventhub=DEBUG
logging.level.org.springframework.web=INFO
