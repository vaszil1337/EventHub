# Server Configuration
server.port=8080

# Application Name
spring.application.name=eventhub-backend

# Datasource Configuration - KIZÁRÓLAG PostgreSQL adatbázis
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eventhub}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# JPA & Hibernate - PostgreSQL Dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.hu.eventhub=DEBUG
logging.level.org.springframework.web=INFO

# Mail Configuration (Mailpit development environment)
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# EventHub Custom Mail Settings
eventhub.mail.from=${EVENTHUB_MAIL_FROM:noreply@eventhub.hu}
eventhub.mail.enabled=${EVENTHUB_MAIL_ENABLED:true}

